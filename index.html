<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هله بحبيبة روحي 🤍</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-color: #fce4ec;
      --text-main: #ffffff;
      --text-sub: #cfd8dc;
      --pink-glow: #ff80ab;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* خلفية النجوم المتلألئة */
    .stars-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--duration) infinite ease-in-out;
      opacity: var(--opacity);
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
    }

    /* شاشة القفل */
    #lock-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .lock-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(15px);
      border-radius: 24px;
      padding: 35px 25px;
      width: 100%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .lock-card h2 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: var(--accent-color);
    }

    .lock-card p.sub-lock {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-bottom: 25px;
    }

    .
